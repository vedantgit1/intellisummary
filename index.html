    <script>
    document.addEventListener('DOMContentLoaded', () => {
        
        // --- Firebase Config ---
        let firebaseApp;
        let firebaseAuth;
        let firestoreDB;
        let authUser = null; // Holds the current logged-in user object
        
        try {
            // This is replaced by Vercel with your Environment Variable
            const firebaseConfigString = process.env.NEXT_PUBLIC_FIREBASE_CONFIG || '{}';
            
            // This line is a fix for Vercel's env variable formatting
            const correctedString = firebaseConfigString.replace(/(\w+:)|(\w+ :)/g, (matched) => {
                return '"' + matched.replace(/[:\s]/g, '') + '":';
            });

            const firebaseConfig = JSON.parse(correctedString);
            
            if (firebaseConfig.apiKey) {
                firebaseApp = firebase.initializeApp(firebaseConfig);
                firebaseAuth = firebase.auth();
                firestoreDB = firebase.firestore();
                console.log("Firebase initialized successfully.");
                setupAuthListener(); // Start listening for login changes
            } else {
                console.error("Firebase config is missing or invalid. Please check Vercel environment variables.");
                // We don't stop here, so the rest of the app can try to load.
            }
        } catch (e) {
            console.error("Error initializing Firebase:", e);
            console.error("Original config string:", process.env.NEXT_PUBLIC_FIREBASE_CONFIG);
        }

        // --- App Elements ---
        const menuBtn = document.getElementById('mobile-menu-btn');
        const mobileMenu = document.getElementById('mobile-menu');
        const appContainer = document.getElementById('app-container');
        const inputState = document.getElementById('app-input-state');
        const loadingState = document.getElementById('app-loading-state');
        const loadingText = document.getElementById('loading-text');
        const loadingSubtext = document.getElementById('loading-subtext');
        const loaderContainer = document.getElementById('loader-container');
        const outputState = document.getElementById('app-output-state');
        
        const dropzone = document.getElementById('file-dropzone');
        const fileUpload = document.getElementById('file-upload');
        const dropzoneText = document.getElementById('dropzone-text');
        const textInput = document.getElementById('text-input');
        const personaBtns = document.querySelectorAll('.persona-btn');
        const analyzeBtn = document.getElementById('analyze-btn');
        const errorMessage = document.getElementById('error-message');
        
        // Output state elements
        const startOverBtn = document.getElementById('start-over-btn');
        const outputFilename = document.getElementById('output-filename');
        const outputTabs = document.getElementById('output-tabs');
        const outputContent = document.getElementById('output-content');
        const translateSelect = document.getElementById('translate-select');
        const copyBtn = document.getElementById('copy-btn');
        const copySuccess = document.getElementById('copy-success');

        // Chat elements
        const chatForm = document.getElementById('chat-form');
        const chatInput = document.getElementById('chat-input');
        const chatSubmitBtn = document.getElementById('chat-submit-btn');
        const chatHistoryEl = document.getElementById('chat-history');
        const chatErrorMessage = document.getElementById('chat-error-message');

        // Speech Elements
        const speechControls = document.getElementById('speech-controls');
        const micBtn = document.getElementById('mic-btn');
        const speechLangSelect = document.getElementById('speech-lang-select');
        
        // Contact Form Elements
        const contactForm = document.getElementById('contact-form');
        const contactFormContent = document.getElementById('contact-form-content');
        const contactSuccessMessage = document.getElementById('contact-success-message');
        const contactSubmitBtn = document.getElementById('contact-submit-btn');
        const contactErrorMessage = document.getElementById('contact-error-message');

        // Auth Elements
        const authModal = document.getElementById('auth-modal');
        const authCloseBtn = document.getElementById('auth-close-btn');
        const signInBtnDesktop = document.getElementById('sign-in-btn-desktop');
        const signInBtnMobile = document.getElementById('sign-in-btn-mobile');
        const googleLoginBtn = document.getElementById('google-login-btn');
        const emailAuthForm = document.getElementById('email-auth-form');
        const emailLoginBtn = document.getElementById('email-login-btn');
        const emailSignupBtn = document.getElementById('email-signup-btn');
        const authErrorMessage = document.getElementById('auth-error-message');
        const freePlanBtn = document.getElementById('free-plan-btn');
        const proPlanBtn = document.getElementById('pro-plan-btn');

        // App State
        let selectedFile = null;
        let selectedPersona = null;
        let fullDocumentText = null; 
        let currentChatHistory = []; 
        let currentChart = null; 
        let originalTabHtml = {}; // Stores original HTML to reset translation
        let originalResponseData = {}; // Stores original AI response for chart/quiz re-render
        let currentActiveTabId = '';
        let isTranslating = false;
        let isPdfLibLoading = false; // Flag to prevent multiple loads
        let recognition = null; // Speech recognition object
        let isListening = false;
        const chatInputPlaceholder = "Ask a follow-up question...";

        // --- Loader/Progress HTML ---
        const standardLoaderHTML = `<div class="loader"></div>`;
        const progressRingHTML = `
            <div class="progress-ring">
                <svg class="w-full h-full" viewBox="0 0 36 36">
                    <path class="progress-ring__background"
                        stroke-width="4"
                        fill="none"
                        d="M18 2.0845
                        a 15.9155 15.9155 0 0 1 0 31.831
                        a 15.9155 15.9155 0 0 1 0 -31.831"
                    />
                    <path class="progress-ring__circle"
                        stroke-width="4"
                        fill="none"
                        stroke-dasharray="100, 100"
                        stroke-dashoffset="100"
                        d="M18 2.0845
                        a 15.9155 15.9155 0 0 1 0 31.831
                        a 15.9155 15.9155 0 0 1 0 -31.831"
                    />
                </svg>
                <span id="progress-ring-text" class="progress-ring__text">0%</span>
            </div>`;
        
        // --- State Validation ---
        function validateState() {
            // PAYWALL: Check if user is logged in
            if (!authUser) {
                analyzeBtn.disabled = false; // Enable it
                analyzeBtn.textContent = 'Sign in to Analyze'; // Change text
                analyzeBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                return; // Stop here
            } else {
                analyzeBtn.textContent = 'Analyze Document';
            }

            const hasFile = selectedFile !== null;
            const hasText = textInput.value.trim().length > 0;
            const hasInput = hasFile || hasText;
            const hasPersona = selectedPersona !== null;

            if (hasInput && hasPersona) {
                analyzeBtn.disabled = false;
                analyzeBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                errorMessage.textContent = '';
            } else {
                analyzeBtn.disabled = true;
                analyzeBtn.classList.add('opacity-50', 'cursor-not-allowed');
            }
        }
 
        // --- File Dropzone Logic ---
        // Attach listeners directly
        if (dropzone) {
            dropzone.addEventListener('click', () => fileUpload.click());
            fileUpload.addEventListener('change', (e) => {
                if (e.target.files.length > 0) handleFile(e.target.files[0]);
            });
            
            ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                dropzone.addEventListener(eventName, preventDefaults, false);
            });
            
            ['dragenter', 'dragover'].forEach(eventName => {
                dropzone.addEventListener(eventName, () => dropzone.classList.add('dragover'), false);
            });
            
            ['dragleave', 'drop'].forEach(eventName => {
                dropzone.addEventListener(eventName, () => dropzone.classList.remove('dragover'), false);
            });
            
            dropzone.addEventListener('drop', (e) => {
                if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
            }, false);
        }

        function preventDefaults(e) {
            e.preventDefault();
            e.stopPropagation();
        }

        // --- "On-Demand" PDF Library Loader ---
        function loadPdfLibraryAndProcess(file) {
            if (isPdfLibLoading) return;
            isPdfLibLoading = true;

            console.log('Loading pdf.js library...');
            loadingText.textContent = 'Loading PDF Reader...'; // Show user
            loadingSubtext.textContent = 'This happens once on your first PDF.';
            loaderContainer.innerHTML = standardLoaderHTML;
            loadingState.classList.remove('hidden');
            inputState.classList.add('hidden');

            const script = document.createElement('script');
            script.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
            
            script.onload = () => {
                console.log('pdf.js library loaded successfully.');
                pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
                isPdfLibLoading = false;
                processPdf(file);
            };
            
            script.onerror = () => {
                console.error('FATAL: Failed to load pdf.js library from CDN.');
                errorMessage.textContent = 'Failed to load PDF library. Please refresh and try again.';
                loadingState.classList.add('hidden');
                inputState.classList.remove('hidden');
                resetFileInput();
                isPdfLibLoading = false;
            };
            document.body.appendChild(script);
        }

        // --- PDF Processing Logic ---
        async function processPdf(file) {
            console.log('Processing PDF...');
            
            loadingState.classList.remove('hidden');
            inputState.classList.add('hidden');
            loaderContainer.innerHTML = progressRingHTML; // Add progress ring
            loadingText.textContent = 'Reading file (0%)...';
            loadingSubtext.textContent = 'Please wait...';

            const progressCircle = document.querySelector('.progress-ring__circle');
            const progressText = document.getElementById('progress-ring-text');
            const radius = 15.9155; 
            const circumference = 2 * Math.PI * radius;
            
            if(progressCircle) {
                progressCircle.style.strokeDasharray = `${circumference} ${circumference}`;
            }

            const reader = new FileReader();

            reader.onprogress = (event) => {
                if (event.lengthComputable) {
                    const percent = Math.round((event.loaded / event.total) * 100);
                    loadingText.textContent = `Reading file (${percent}%)...`;
                    if(progressCircle && progressText) {
                        const offset = circumference - (percent / 100) * circumference;
                        progressCircle.style.strokeDashoffset = offset;
                        progressText.textContent = `${percent}%`;
                    }
                }
            };

            reader.onload = async (e) => {
                loadingText.textContent = 'Parsing PDF...'; 
                loadingSubtext.textContent = 'This may take a moment for large files.';
                
                try {
                    const pdfData = new Uint8Array(e.target.result);
                    const pdf = await pdfjsLib.getDocument({ data: pdfData }).promise;
                    let textContent = '';
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const text = await page.getTextContent();
                        textContent += text.items.map(s => s.str).join(' ') + '\n';
                    }
                    fullDocumentText = textContent;
                    validateState();
                } catch (pdfError) {
                    console.error('PDF parsing error:', pdfError);
                    errorMessage.textContent = 'Error parsing PDF file. It may be corrupt or encrypted.';
                    resetFileInput();
                } finally {
                    loadingState.classList.add('hidden');
                    inputState.classList.remove('hidden');
                }
            };
            reader.onerror = () => {
                errorMessage.textContent = 'Error reading file.';
                resetFileInput();
            };
            reader.readAsArrayBuffer(file);
        }

        // --- Main handleFile Function ---
        function handleFile(file) {
            if (file.type !== 'text/plain' && file.type !== 'application/pdf') {
                errorMessage.textContent = 'Only .PDF and .TXT files are supported.';
                resetFileInput();
                return;
            }

            selectedFile = file;
            dropzoneText.textContent = file.name;
            dropzoneText.classList.add('gradient-text', 'font-bold');
            textInput.value = ''; 
            textInput.disabled = true;
            errorMessage.textContent = '';
            
            if (file.type === 'application/pdf') {
                if (typeof pdfjsLib === 'undefined') {
                    loadPdfLibraryAndProcess(file);
                } else {
                    processPdf(file);
                }
                return;
            } 
            
            // --- .TXT file logic ---
            loadingState.classList.remove('hidden');
            inputState.classList.add('hidden');
            loadingSubtext.textContent = 'Please wait...';
            loaderContainer.innerHTML = standardLoaderHTML;
            loadingText.textContent = 'Reading file...';

            const reader = new FileReader();
            reader.onload = (e) => {
                fullDocumentText = e.target.result;
                validateState();
                loadingState.classList.add('hidden');
                inputState.classList.remove('hidden');
            };
            reader.onerror = () => {
                errorMessage.textContent = 'Error reading file.';
                resetFileInput();
            };
            reader.readAsText(file);
        }

        function resetFileInput() {
            selectedFile = null;
            fullDocumentText = null;
            fileUpload.value = null; 
            textInput.value = '';
            textInput.disabled = false;
            dropzoneText.textContent = 'Drag & Drop your .PDF or .TXT file';
            dropzoneText.classList.remove('gradient-text', 'font-bold');
            loadingState.classList.add('hidden');
            inputState.classList.remove('hidden');
            validateState();
        }

        // --- Text Input Logic ---
        textInput.addEventListener('input', () => {
            if (textInput.value.trim().length > 0) {
                if (selectedFile) resetFileInput(); 
                fullDocumentText = textInput.value.trim();
            } else {
                fullDocumentText = null;
            }
            validateState();
        });

        // --- Persona Selection ---
        personaBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                personaBtns.forEach(b => b.classList.remove('selected'));
                btn.classList.add('selected');
                selectedPersona = btn.dataset.persona;
                validateState();
            });
        });

        // --- Analyze Button Click ---
        analyzeBtn.addEventListener('click', async () => {
            // PAYWALL: Check for login
            if (!authUser) {
                openAuthModal();
                return;
            }
            
            if (analyzeBtn.disabled) {
                errorMessage.textContent = 'Please add a file (or paste text) and select a mode.';
                return;
            }
            
            inputState.classList.add('hidden');
            outputState.classList.add('hidden');
            loaderContainer.innerHTML = standardLoaderHTML; // Use standard spinner for AI
            loadingText.textContent = 'Analyzing your document...';
            loadingSubtext.textContent = 'Making sense of the data and generating insights.';
            loadingState.classList.remove('hidden');
            errorMessage.textContent = '';
            
            outputFilename.textContent = selectedFile ? selectedFile.name : 'Pasted Text';

            if (!fullDocumentText) {
                errorMessage.textContent = 'Could not read input text.';
                loadingState.classList.add('hidden');
                inputState.classList.remove('hidden');
                return;
            }

            currentChatHistory = [];
            chatHistoryEl.innerHTML = '<div class="chat-bubble chat-bubble-ai">Ask me a follow-up question about your document!</div>';

            try {
                const aiResponse = await callApi('/api/generate', {
                    text: fullDocumentText,
                    persona: selectedPersona
                });
                
                originalResponseData[selectedPersona] = aiResponse; // Store full response
                loadingState.classList.add('hidden');
                outputState.classList.remove('hidden');
                displayRealOutput(aiResponse, selectedPersona);

            } catch (error) {
                console.error('Error calling Gemini API:', error);
                
                if (error.message.includes('402')) {
                    errorMessage.textContent = `UPGRADE REQUIRED: ${error.message.split(': ')[1]}`;
                } else if (error.message.includes('401')) {
                    errorMessage.textContent = `Authentication Error. Please sign out and log back in.`;
                } else {
                    errorMessage.textContent = `AI Error: ${error.message}. Please try again.`;
                }
                
                loadingState.classList.add('hidden');
                inputState.classList.remove('hidden');
            }
        });

        // --- Start Over Button ---
        startOverBtn.addEventListener('click', () => {
            outputState.classList.add('hidden');
            loadingState.classList.add('hidden');
            inputState.classList.remove('hidden');
            
            selectedFile = null;
            selectedPersona = null;
            fullDocumentText = null;
            fileUpload.value = null;
            textInput.value = '';
            textInput.disabled = false;
            dropzoneText.textContent = 'Drag & Drop your .PDF or .TXT file';
            dropzoneText.classList.remove('gradient-text', 'font-bold');
            personaBtns.forEach(b => b.classList.remove('selected'));
            if (currentChart) {
                currentChart.destroy();
                currentChart = null;
            }
            originalTabHtml = {};
            originalResponseData = {};
            translateSelect.value = '';
            validateState();
        });
        
        // --- Display REAL Output ---
        function displayRealOutput(response, persona) {
            outputTabs.innerHTML = '';
            outputContent.innerHTML = '';
            if (!originalTabHtml[persona]) { // Only clear cache if it's a new generation
                originalTabHtml = {};
            }
            translateSelect.value = ''; 

            const allTabs = [
                { id: 'summary', name: 'Quick Summary' },
                { id: 'student', name: 'Study Buddy' },
                { id: 'business', name: 'Business Analyst' }
            ];
            
            let contentHtml = '';

            try {
                switch (persona) {
                    case 'business':
                        contentHtml = `
                            <h3 class="text-lg font-semibold text-white mb-3" data-translate>Key Data Insights</h3>
                            <p class="text-gray-300 mb-4" data-translate>${response.keyInsights}</p>
                            
                            <h3 class="text-lg font-semibold text-white mb-3" data-translate>Data Visualization</h3>
                            <div class="chart-container bg-gray-800 p-4 rounded-lg">
                                <canvas id="outputChart"></canvas>
                            </div>
                            
                            <h3 class="text-lg font-semibold text-white mt-6 mb-3" data-translate>Extracted Data Table</h3>
                            <div class="overflow-x-auto">
                            <table class="w-full min-w-max text-left text-sm text-gray-300">
                                <thead class="bg-gray-800 text-xs text-gray-400 uppercase">
                                    <tr>
                                        <th scope="col" class="py-3 px-4 rounded-l-lg" data-translate>Metric</th>
                                        <th scope="col" class="py-3 px-4" data-translate>Value</th>
                                        <th scope="col" class="py-3 px-4 rounded-r-lg" data-translate>Change</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-gray-700">
                                    ${response.tableData.map(row => `
                                        <tr class="bg-gray-900">
                                            <td class="py-3 px-4 font-medium" data-translate>${row.metric}</td>
                                            <td class="py-3 px-4" data-translate>${row.value}</td>
                                            <td class="py-3 px-4 ${String(row.change).startsWith('+') ? 'text-green-400' : String(row.change).startsWith('-') ? 'text-red-400' : ''}" data-translate>${row.change}</td>
                                        </tr>
                                    `).join('')}
                                </tbody>
                            </table>
                            </div>
                        `;
                        break;
                    case 'student':
                        contentHtml = `
                            <h3 class="text-lg font-semibold text-white mb-3" data-translate>Simplified Concepts 🧠</h3>
                            <div class="space-y-4 text-gray-300">
                                ${response.simplifiedConcepts.map(item => `
                                    <div class="bg-gray-800 p-4 rounded-lg">
                                        <strong class="text-purple-300" data-translate>${item.concept}:</strong>
                                        <p data-translate>${item.explanation}</p>
                                    </div>
                                `).join('')}
                            </div>
                            
                            <h3 class="text-lg font-semibold text-white mt-6 mb-3" data-translate>Check Your Knowledge! 🎓</h3>
                            <div id="quiz-container" class="bg-gray-800 p-4 rounded-lg text-gray-300">
                                <p class="font-semibold mb-3" data-translate>${response.quiz.question}</p>
                                <div class="space-y-2">
                                    ${response.quiz.options.map((option, index) => `
                                        <button class="quiz-option block w-full text-left p-3 rounded-lg bg-gray-700 hover:bg-gray-600 transition-colors" data-index="${index}" data-translate>
                                            ${option}
                                        </button>
                                    `).join('')}
                                </div>
                                <p id="quiz-feedback" class="mt-3 text-sm h-4"></p>
                            </div>
                        `;
                        break;
                    case 'summary':
                    default:
                        contentHtml = `
                            <h3 class="text-lg font-semibold text-white mb-3" data-translate>Key Points</h3>
                            <ul class="space-y-2 text-gray-300 list-disc list-inside">
                                ${response.keyPoints.map(point => `<li data-translate>${point}</li>`).join('')}
                            </ul>
                            <h3 class="text-lg font-semibold text-white mt-6 mb-3" data-translate>Full Summary</h3>
                            <p class="text-gray-300 whitespace-pre-wrap" data-translate>${response.fullSummary}</p>
                        `;
                        break;
                }
            } catch (e) {
                console.error("Error displaying output:", e, "Response:", response);
                contentHtml = `<p class="text-red-400">Error: The AI response was not in the expected format. Please try again.</p>`;
            }

            // Create tabs
            allTabs.forEach(tab => {
                const tabBtn = document.createElement('button');
                tabBtn.className = `py-3 px-4 font-semibold text-sm rounded-t-lg transition-colors border-b-2`;
                tabBtn.textContent = tab.name;
                tabBtn.dataset.tabId = tab.id;
                
                if (tab.id === persona) {
                    tabBtn.classList.add('text-purple-400', 'border-purple-400');
                    tabBtn.classList.remove('text-gray-400', 'border-transparent', 'hover:text-gray-200', 'hover:border-gray-500');
                    outputContent.innerHTML = contentHtml;
                    originalTabHtml[tab.id] = contentHtml; // Store original HTML
                    currentActiveTabId = tab.id;
                } else {
                    tabBtn.classList.add('text-gray-400', 'border-transparent', 'hover:text-gray-200', 'hover:border-gray-500');
                }
                tabBtn.addEventListener('click', () => switchTab(tab.id));
                outputTabs.appendChild(tabBtn);
            });

            // Post-render actions
            if (persona === 'business' && response.chartData) {
                // Check if Chart.js is loaded
                if(typeof Chart === 'undefined') {
                    console.error("Chart.js is not loaded. Cannot render chart.");
                    const chartContainer = outputContent.querySelector('.chart-container');
                    if(chartContainer) chartContainer.innerHTML = `<p class="text-red-400">Error: Chart library failed to load.</p>`;
                } else {
                    setTimeout(() => renderChart(response.chartData), 100);
                }
            }
            if (persona === 'student' && response.quiz) {
                setupQuiz(response.quiz);
            }
        }

        function renderChart(chartData) {
            if (currentChart) {
                currentChart.destroy();
            }
            const ctx = document.getElementById('outputChart');
            if (!ctx) return;
            
            try {
                currentChart = new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: chartData.labels,
                        datasets: chartData.datasets.map(ds => ({
                            label: ds.label,
                            data: ds.data,
                            backgroundColor: ds.backgroundColor || 'rgba(168, 85, 247, 0.5)',
                            borderColor: ds.backgroundColor ? ds.backgroundColor.replace('0.5', '1') : 'rgba(168, 85, 247, 1)',
                            borderWidth: 1
                        }))
                    },
                    options: {
                        responsive: true,
                        maintainAspectRatio: false,
                        scales: {
                            y: {
                                beginAtZero: true,
                                ticks: { color: '#9CA3AF' },
                                grid: { color: '#374151' }
                            },
                            x: {
                                ticks: { color: '#9CA3AF' },
                                grid: { color: '#374151' }
                            }
                        },
                        plugins: {
                            legend: {
                                labels: { color: '#D1D5DB' }
                            }
                        }
                    }
                });
            } catch (e) {
                console.error("Chart.js error:", e);
                const chartContainer = outputContent.querySelector('.chart-container');
                if(chartContainer) {
                    chartContainer.innerHTML = `<p class="text-red-400">Error rendering chart.</p>`;
                }
            }
        }

        function setupQuiz(quiz) {
            const quizContainer = document.getElementById('quiz-container');
            if (!quizContainer) return;
            
            const feedbackEl = document.getElementById('quiz-feedback');
            
            quizContainer.addEventListener('click', (e) => {
                const optionBtn = e.target.closest('.quiz-option');
                if (!optionBtn) return;
                
                document.querySelectorAll('.quiz-option').forEach(btn => {
                    btn.classList.remove('bg-green-700', 'bg-red-700');
                    btn.classList.add('bg-gray-700');
                });
                
                const selectedIndex = parseInt(optionBtn.dataset.index, 10);
                if (selectedIndex === quiz.answerIndex) {
                    optionBtn.classList.remove('bg-gray-700');
                    optionBtn.classList.add('bg-green-700');
                    feedbackEl.textContent = 'Correct! 🎉';
                    feedbackEl.className = 'mt-3 text-sm h-4 text-green-400';
                } else {
                    optionBtn.classList.remove('bg-gray-700');
                    optionBtn.classList.add('bg-red-700');
                    feedbackEl.textContent = 'Not quite. Try again!';
                    feedbackEl.className = 'mt-3 text-sm h-4 text-red-400';
                    const correctBtn = quizContainer.querySelector(`[data-index="${quiz.answerIndex}"]`);
                    if (correctBtn) {
                        correctBtn.classList.remove('bg-gray-700');
                        correctBtn.classList.add('bg-green-700');
                    }
                }
            });
        }

        async function switchTab(tabId) {
            if (currentActiveTabId === tabId || isTranslating) return; 

            outputTabs.querySelectorAll('button').forEach(btn => {
                if (btn.dataset.tabId === tabId) {
                    btn.classList.add('text-purple-400', 'border-purple-400');

        // --- Chat Logic ---
        chatForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            // PAYWALL: Check for login
            if (!authUser) {
                openAuthModal();
                return;
            }

            const question = chatInput.value.trim();
            if (!question) return;

            chatInput.value = '';
            chatErrorMessage.textContent = '';
            addChatMessage(question, true);

            const loadingBubble = document.createElement('div');
            loadingBubble.className = 'chat-bubble chat-bubble-ai opacity-50';
            loadingBubble.textContent = '...';
            chatHistoryEl.appendChild(loadingBubble);
            chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;

            try {
                const response = await callApi('/api/chat', {
                    question: question,
                    documentText: fullDocumentText,
                    chatHistory: currentChatHistory
                });

                addChatMessage(response.answer, false);
                loadingBubble.remove(); 

            } catch (error) {
                console.error('Chat error:', error);
                
                if (error.message.includes('402')) {
                    chatErrorMessage.textContent = `UPGRADE REQUIRED: ${error.message.split(': ')[1]}`;
                } else if (error.message.includes('401')) {
                    chatErrorMessage.textContent = `Authentication Error. Please sign out and log back in.`;
                } else {
                    chatErrorMessage.textContent = `Chat Error: ${error.message}. Please try again.`;
                }

                loadingBubble.remove();
            }
        });

        function addChatMessage(text, isUser) {
            const bubble = document.createElement('div');
            bubble.className = `chat-bubble ${isUser ? 'chat-bubble-user' : 'chat-bubble-ai'}`;
            
            const formattedText = text
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/\n/g, '<br>'); 
            
            bubble.innerHTML = `<div class="chat-message-text">${formattedText}</div>`;
            
            chatHistoryEl.appendChild(bubble);
            chatHistoryEl.scrollTop = chatHistoryEl.scrollHeight;
            
            currentChatHistory.push({ isUser: isUser, text: text });
        }

        // --- Translate Logic ---
        translateSelect.addEventListener('change', async (e) => {
            if (isTranslating) return;
            isTranslating = true;
            
            const language = e.target.value;
            
            // Always restore from original HTML
            if (originalTabHtml[currentActiveTabId]) {
                outputContent.innerHTML = originalTabHtml[currentActiveTabId];
                // Re-run post-render for chart/quiz
                const response = originalResponseData[currentActiveTabId];
                if (response) {
                    if (currentActiveTabId === 'business' && response.chartData) {
                         if(typeof Chart !== 'undefined') {
                            setTimeout(() => renderChart(response.chartData), 100);
                         }
                    }
                    if (currentActiveTabId === 'student' && response.quiz) {
                        setupQuiz(response.quiz);
                    }
                }
            }

            if (!language) {
                isTranslating = false;
                return; // Just reset to original
            }

            const elementsToTranslate = outputContent.querySelectorAll('[data-translate]');
            if (elementsToTranslate.length === 0) {
                isTranslating = false;
                return;
            }

            const originalTexts = Array.from(elementsToTranslate).map(el => el.textContent);
            const loadingIndicator = '...';
            elementsToTranslate.forEach(el => el.textContent = loadingIndicator);

            try {
                // PAYWALL: Check for login before calling API
                if (!authUser) {
                    openAuthModal();
                    throw new Error("401: Login required for translation.");
                }

                const translatedTexts = [];
                const promises = originalTexts.map(text => {
                    if (text.trim() === '') {
                        return Promise.resolve('');
                    }
                    return callApi('/api/translate', {
                        text: text,
                        targetLanguage: language
                    }).then(response => response.translatedText);
                });
                
                const results = await Promise.all(promises);

                // Re-find elements and replace text
                outputContent.querySelectorAll('[data-translate]').forEach((el, index) => {
                    if (results[index] != null) { 
                        el.textContent = results[index];
                    } else {
                        el.textContent = originalTexts[index];
                    }
                });

            } catch (error) {
                console.error('Translate error:', error);
                
                if (error.message.includes('401')) {
                     alert(`Error: ${error.message.split(':')[1] || 'Login required for translation.'}`);
                } else if (error.message.includes('402')) {
                    alert(`UPGRADE REQUIRED: ${error.message.split(': ')[1]}`);
                } else {
                    alert(`Translation failed: ${error.message}`);
                }
                
                // Restore original content on failure
                outputContent.innerHTML = originalTabHtml[currentActiveTabId];
                const response = originalResponseData[currentActiveTabId];
                if (response) {
                     if (currentActiveTabId === 'business' && response.chartData) {
                         if(typeof Chart !== 'undefined') {
                            setTimeout(() => renderChart(response.chartData), 100);
                         }
                    }
                    if (currentActiveTabId === 'student' && response.quiz) {
                        setupQuiz(response.quiz);
                    }
                }
            } finally {
                isTranslating = false;
            }
        });
        
        // --- Copy Logic ---
        copyBtn.addEventListener('click', () => {
            const contentToCopy = outputContent.innerText;
            
            if (navigator.clipboard) {
                navigator.clipboard.writeText(contentToCopy).then(() => {
                    copySuccess.classList.remove('hidden');
                    setTimeout(() => copySuccess.classList.add('hidden'), 2000);
                }).catch(err => {
                    console.error('Failed to copy text: ', err);
                    alert('Failed to copy text.');
                });
            } else {
                const textArea = document.createElement('textarea');
                textArea.value = contentToCopy;
                document.body.appendChild(textArea);
                textArea.select();
                try {
                    document.execCommand('copy');
                    copySuccess.classList.remove('hidden');
                    setTimeout(() => copySuccess.classList.add('hidden'), 2000);
                } catch (err) {
                    console.error('Failed to copy text: ', err);
                    alert('Failed to copy text.');
                }
                document.body.removeChild(textArea);
            }
        });

        // --- Speech Recognition Logic ---
        function setupSpeechRecognition() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            
            if (SpeechRecognition) {
                recognition = new SpeechRecognition();
                recognition.continuous = false; // Stop after one phrase
                recognition.interimResults = false;
                
                recognition.onstart = () => {
                    isListening = true;
                    micBtn.classList.add('mic-listening');
                    chatInput.placeholder = 'Listening...';
                    chatErrorMessage.textContent = '';
                };
                
                recognition.onend = () => {
                    isListening = false;
                    micBtn.classList.remove('mic-listening');
                    chatInput.placeholder = chatInputPlaceholder;
                };
                
                recognition.onresult = (event) => {
                    const transcript = event.results[0][0].transcript;
                    chatInput.value = transcript;
                };
                
                recognition.onerror = (event) => {
                    if (event.error === 'no-speech' || event.error === 'audio-capture') {
                        chatErrorMessage.textContent = 'Mic error: Could not hear you. Please try again.';
                    } else if (event.error === 'not-allowed') {
                        chatErrorMessage.textContent = 'Mic access was denied. Please allow it in your browser.';
                    } else {
                        chatErrorMessage.textContent = `Mic error: ${event.error}`;
                    }
                    console.error('Speech recognition error:', event.error);
                };
                
                micBtn.addEventListener('click', () => {
                    if (isListening) {
                        recognition.stop();
                    } else {
                        try {
                            recognition.lang = speechLangSelect.value;
                            recognition.start();
                        } catch (e) {
                            console.error("Error starting recognition:", e);
                            chatErrorMessage.textContent = 'Mic error: Could not start.';
                        }
                    }
                });

            } else {
                console.warn('Web Speech API (SpeechRecognition) not supported in this browser.');
                speechControls.classList.add('hidden'); // Hide mic & lang select
            }
        }
        setupSpeechRecognition(); // Call the setup function

        contactForm.addEventListener('submit', async (e) => {

            const email = document.getElementById('contact-email').value;

        // --- ********************************* ---
        // --- NEW: AUTHENTICATION LOGIC
        // --- ********************************* ---
        
        function openAuthModal() {
            authModal.classList.add('active');
            authErrorMessage.textContent = '';
        }
        function closeAuthModal() {
            authModal.classList.remove('active');
            authErrorMessage.textContent = '';
        }

        // --- Auth Listeners ---
        signInBtnDesktop.addEventListener('click', (e) => {
            e.preventDefault();
            openAuthModal();
        });
        signInBtnMobile.addEventListener('click', (e) => {
            e.preventDefault();

        });

        });

        // --- Main Auth State Listener ---
        function setupAuthListener() {
            if (!firebaseAuth) return; // Prevent errors if Firebase failed to initialize
            
            firebaseAuth.onAuthStateChanged(async (user) => {
                if (user) {
                    // User is signed in
                    console.log('User is signed in:', user.email);
                    authUser = user;
                    updateUIForLoggedInUser(user);
                    
                    // Critical: Ensure the user exists in Firestore on EVERY login
                    // This handles new Google users and existing users who just logged in.
                    const token = await user.getIdToken();
                    try {
                        // Pass the token to our new /api/create-user endpoint
                        await fetch('/api/create-user', {
                            method: 'POST',
                            headers: { 
                                'Content-Type': 'application/json'
                                // Authorization is not strictly needed here, but good practice
                                // 'Authorization': `Bearer ${token}` 
                            },
                            body: JSON.stringify({ token: token }) // Send token in body
                        });
                    } catch (e) {
                         console.error("Failed to create/check user in Firestore:", e);
                         // If we fail here, we should probably sign them out
                         firebaseAuth.signOut();
                    }
                    
                    closeAuthModal();
                } else {
                    // User is signed out
                    console.log('User is signed out.');
                    authUser = null;
                    updateUIForLoggedOutUser();
                }
                validateState(); // Update analyze button text/state
            });
        }

        // --- Universal API Call Function ---
        async function callApi(endpoint, body) {
            let authToken = null;
            if (authUser) {
                try {
                    // Get the latest token to ensure it hasn't expired
                    authToken = await authUser.getIdToken(true); 
                } catch (e) {
                    console.error('Could not get auth token, signing out:', e);
                    firebaseAuth.signOut(); 
                    throw new Error("401: Session expired. Please sign in again.");
                }
            }

            let response;
            let delay = 1000;
            for (let i = 0; i < 5; i++) {
                response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        // Send the token in the header for backend verification
                        'Authorization': `Bearer ${authToken}`
                    },
                    body: JSON.stringify(body || {}) // Ensure body is an object
                });

                if (response.ok) {
                    return response.json(); 
                } else if (response.status === 429 || response.status >= 500) {
                    await new Promise(resolve => setTimeout(resolve, delay));
                    delay *= 2;
                } else {
                    const errorBody = await response.json();
                    throw new Error(errorBody.error || `HTTP error! status: ${response.status}`);
                }
            }
            throw new Error('API request failed after all retries.');
        }
    
    }); // --- End of DOMContentLoaded ---
